# 1시간마다 네이버 블로그 새 글을 posts.json에 반영합니다.
# Actions 탭에서 "Run workflow"를 누르면 바로 실행할 수도 있어요.
name: Update blog posts

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (정각은 GitHub가 붐벼서 늦어지기 쉬워요)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch RSS
        run: python scripts/fetch_posts.py posts.json

      - name: Commit if changed
        run: |
          git add posts.json
          if git diff --cached --quiet; then
            echo "새 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "블로그 새 글 반영"
          git push
